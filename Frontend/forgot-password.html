<!DOCTYPE html>
<html>
<head>
    <title>Forgot Password</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="forgot-page">

<header>
    <h1>City Hospital Appointment System</h1>
</header>

<div class="container">
    <h2>Forgot Password</h2>
    <p>Enter your email and set a new password.</p>

    <form id="resetForm">
        <label>Email</label>
        <input id="email" type="email" required placeholder="example@gmail.com">

        <label>New Password</label>
        <input id="newPassword" type="password" required placeholder="New password">

        <label>Confirm Password</label>
        <input id="confirmPassword" type="password" required placeholder="Confirm password">

        <button type="submit">Save</button>
    </form>

    <p id="message" style="margin-top: 14px;"></p>

    <a href="login.html"><button type="button">Back to Login</button></a>
</div>

<script>
    const form = document.getElementById("resetForm");
    const message = document.getElementById("message");

    form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const email = document.getElementById("email").value.trim();
        const newPassword = document.getElementById("newPassword").value;
        const confirmPassword = document.getElementById("confirmPassword").value;

        message.textContent = "";

        try {
            const res = await fetch("http://localhost:5000/api/auth/reset-password", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email, newPassword, confirmPassword })
            });

            const data = await res.json().catch(() => ({}));

            if (!res.ok) {
                message.textContent = data.message || "Password reset failed.";
                return;
            }

            message.textContent = data.message || "Password updated successfully.";
            setTimeout(() => {
                window.location.href = "login.html";
            }, 900);
        } catch (err) {
            message.textContent = "Server not reachable. Start backend first.";
        }
    });
</script>

</body>
</html>
